name: MusicPlayer
options:
  bundleIdPrefix: com.audiophile.musicplayer
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_OBJC_BRIDGING_HEADER: MusicPlayer/MusicPlayer-Bridging-Header.h
    ENABLE_PREVIEWS: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  MusicPlayer:
    type: application
    platform: iOS
    sources:
      - path: MusicPlayer
        type: group
    info:
      path: MusicPlayer/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        UIStatusBarStyle: UIStatusBarStyleLightContent
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDisplayName: "Vanta"
        CFBundleName: "Vanta"
    settings:
      base:
        INFOPLIST_FILE: MusicPlayer/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.audiophile.vanta
        PRODUCT_NAME: "Vanta"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_OBJC_INTERFACE_HEADER_NAME: MusicPlayer-Swift.h
        CLANG_ENABLE_MODULES: YES
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
          - "-all_load"
    dependencies:
      - framework: DSPNative.xcframework
        embed: true
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: Accelerate.framework

  DSPNative:
    type: framework
    platform: iOS
    sources:
      - path: DSPNative
        type: group
    settings:
      base:
        PRODUCT_NAME: DSPNative
        SKIP_INSTALL: NO
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        PUBLIC_HEADERS_FOLDER_PATH: include
        DEFINES_MODULE: YES
        SWIFT_OBJC_INTERFACE_HEADER_NAME: DSPNative-Swift.h
        CLANG_ENABLE_MODULES: YES
        OTHER_CFLAGS:
          - "-I$(SRCROOT)/DSPNative/include"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/DSPNative/include"
