name: Production checks

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject whitespace and conflict-marker damage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA" HEAD
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= HEAD
          fi

  android:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android compile, tests, lint, and release package
        shell: pwsh
        run: .\gradlew.bat :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
      - name: Desktop compile
        shell: pwsh
        run: |
          $env:DESKTOP_ONLY = "true"
          .\gradlew.bat :desktopApp:compileKotlin --stacktrace

  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Critical phone UI journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

  services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            station-backend/package-lock.json
            workers/music-gateway/package-lock.json
      - name: Station backend
        working-directory: station-backend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Music gateway
        working-directory: workers/music-gateway
        run: |
          npm ci
          npm run typecheck
          npm test
          npm audit --audit-level=high
          npx wrangler deploy --dry-run
