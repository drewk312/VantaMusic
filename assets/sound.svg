<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="614" viewBox="0 0 1280 614"><defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E3BF"/><stop offset=".55" stop-color="#E0B872"/><stop offset="1" stop-color="#A8793A"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17161A"/><stop offset="1" stop-color="#0F0F12"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5A4A30"/><stop offset=".5" stop-color="#2A2620"/><stop offset="1" stop-color="#4A3D28"/></linearGradient></defs><style>.t{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}</style><rect x="12" y="6" width="1256" height="602" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="1.2"/><text x="64" y="83" class="t" font-size="16" font-weight="600" letter-spacing="4" text-anchor="start" fill="url(#gold)" >LOSSLESS</text><text x="330" y="84" class="t" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start" fill="#E6DFD3" >FLAC up to 24-bit, plus your own FLAC, ALAC and WAV files.</text><rect x="56" y="106" width="1168" height="1" fill="#2A2620"/><text x="64" y="159" class="t" font-size="16" font-weight="600" letter-spacing="4" text-anchor="start" fill="url(#gold)" >SPATIAL</text><text x="330" y="160" class="t" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start" fill="#E6DFD3" >Dolby Atmos, Sony 360 Reality Audio and 5.1 / 7.1 surround.</text><text x="330" y="194" class="t" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start" fill="#B9AE9C" >Spatial audio with head tracking, or let your phone&#x27;s own Atmos take over.</text><rect x="56" y="216" width="1168" height="1" fill="#2A2620"/><text x="64" y="269" class="t" font-size="16" font-weight="600" letter-spacing="4" text-anchor="start" fill="url(#gold)" >EQUALIZER</text><text x="330" y="270" class="t" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start" fill="#E6DFD3" >A 31-band EQ, and a 10-band parametric EQ with frequency, gain and Q.</text><text x="330" y="304" class="t" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start" fill="#B9AE9C" >Import AutoEQ, Squig.link and Equalizer APO presets.</text><rect x="56" y="326" width="1168" height="1" fill="#2A2620"/><text x="64" y="379" class="t" font-size="16" font-weight="600" letter-spacing="4" text-anchor="start" fill="url(#gold)" >EFFECTS</text><text x="330" y="380" class="t" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start" fill="#E6DFD3" >Bass Cannon, tube amp and a convolver.</text><rect x="56" y="402" width="1168" height="1" fill="#2A2620"/><text x="64" y="455" class="t" font-size="16" font-weight="600" letter-spacing="4" text-anchor="start" fill="url(#gold)" >SOUND CHECK</text><text x="330" y="456" class="t" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start" fill="#E6DFD3" >Evens out the volume between tracks.</text><rect x="56" y="478" width="1168" height="1" fill="#2A2620"/><text x="64" y="531" class="t" font-size="16" font-weight="600" letter-spacing="4" text-anchor="start" fill="url(#gold)" >FILE INFO</text><text x="330" y="532" class="t" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start" fill="#E6DFD3" >Reads the sample rate and bit depth straight from your files.</text><text x="330" y="566" class="t" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start" fill="#B9AE9C" >The Hi-Res badge only shows when a file really is hi-res.</text></svg>
