<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="628" viewBox="0 0 1280 628"><defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E3BF"/><stop offset=".55" stop-color="#E0B872"/><stop offset="1" stop-color="#A8793A"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17161A"/><stop offset="1" stop-color="#0F0F12"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5A4A30"/><stop offset=".5" stop-color="#2A2620"/><stop offset="1" stop-color="#4A3D28"/></linearGradient></defs><style>.t{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}</style><g class="c" style="animation-delay:0.00s"><g transform="translate(12,12)"><rect width="616" height="290" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="1.2"/><circle cx="74" cy="76" r="34" fill="#1C1A17" stroke="#3A3326"/><g transform="translate(74,76)"><path d="M-15 8v-5a15 15 0 0 1 30 0v5" fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round"/><rect x="-18" y="4" width="8" height="13" rx="3" fill="url(#gold)"/><rect x="10" y="4" width="8" height="13" rx="3" fill="url(#gold)"/></g><text x="48" y="162" class="t" font-size="32" font-weight="600" letter-spacing="0" text-anchor="start" fill="#EFE8DC" >Hear all of it</text><text x="48" y="208" class="t" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start" fill="#B9AE9C" >Lossless FLAC up to 24-bit, Dolby Atmos,</text><text x="48" y="239" class="t" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start" fill="#B9AE9C" >Sony 360 Reality Audio and 5.1 / 7.1 surround.</text><text x="48" y="270" class="t" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start" fill="#B9AE9C" >A badge always tells you what&#x27;s playing.</text></g></g><g class="c" style="animation-delay:0.12s"><g transform="translate(652,12)"><rect width="616" height="290" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="1.2"/><circle cx="74" cy="76" r="34" fill="#1C1A17" stroke="#3A3326"/><g transform="translate(74,76)"><line x1="-11" y1="-14" x2="-11" y2="14" stroke="#6B5A3C" stroke-width="2.4" stroke-linecap="round"/><circle cx="-11" cy="5" r="4.6" fill="url(#gold)"/><line x1="0" y1="-14" x2="0" y2="14" stroke="#6B5A3C" stroke-width="2.4" stroke-linecap="round"/><circle cx="0" cy="-7" r="4.6" fill="url(#gold)"/><line x1="11" y1="-14" x2="11" y2="14" stroke="#6B5A3C" stroke-width="2.4" stroke-linecap="round"/><circle cx="11" cy="2" r="4.6" fill="url(#gold)"/></g><text x="48" y="162" class="t" font-size="32" font-weight="600" letter-spacing="0" text-anchor="start" fill="#EFE8DC" >An EQ that does something</text><text x="48" y="208" class="t" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start" fill="#B9AE9C" >A 31-band EQ and a 10-band parametric EQ</text><text x="48" y="239" class="t" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start" fill="#B9AE9C" >that you hear change as you move them.</text><text x="48" y="270" class="t" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start" fill="#B9AE9C" >Load the AutoEQ preset for your IEMs.</text></g></g><g class="c" style="animation-delay:0.24s"><g transform="translate(12,326)"><rect width="616" height="290" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="1.2"/><circle cx="74" cy="76" r="34" fill="#1C1A17" stroke="#3A3326"/><g transform="translate(74,76)"><circle r="4" fill="url(#gold)"/><path d="M-9 -9a13 13 0 0 0 0 18M9 -9a13 13 0 0 1 0 18M-15 -15a21 21 0 0 0 0 30M15 -15a21 21 0 0 1 0 30" fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round"/></g><text x="48" y="162" class="t" font-size="32" font-weight="600" letter-spacing="0" text-anchor="start" fill="#EFE8DC" >Radio that stays on genre</text><text x="48" y="208" class="t" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start" fill="#B9AE9C" >147 genres and subgenres, each an endless</text><text x="48" y="239" class="t" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start" fill="#B9AE9C" >station that learns from your thumbs.</text><text x="48" y="270" class="t" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start" fill="#B9AE9C" >50s rock and roll plays Chuck Berry, not Pharrell.</text></g></g><g class="c" style="animation-delay:0.36s"><g transform="translate(652,326)"><rect width="616" height="290" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="1.2"/><circle cx="74" cy="76" r="34" fill="#1C1A17" stroke="#3A3326"/><g transform="translate(74,76)"><g transform="rotate(-45)"><rect x="-17" y="-6.5" width="20" height="13" rx="6.5" fill="none" stroke="url(#gold)" stroke-width="2.4"/><rect x="-3" y="-6.5" width="20" height="13" rx="6.5" fill="none" stroke="url(#gold)" stroke-width="2.4"/></g></g><text x="48" y="162" class="t" font-size="32" font-weight="600" letter-spacing="0" text-anchor="start" fill="#EFE8DC" >Bring your music, share it back</text><text x="48" y="208" class="t" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start" fill="#B9AE9C" >Share a Spotify playlist straight in, no login.</text><text x="48" y="239" class="t" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start" fill="#B9AE9C" >Send a friend a song as a link, and it</text><text x="48" y="270" class="t" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start" fill="#B9AE9C" >opens right in their VANTA.</text></g></g></svg>
