<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="418" viewBox="0 0 1280 418"><defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E3BF"/><stop offset=".55" stop-color="#E0B872"/><stop offset="1" stop-color="#A8793A"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17161A"/><stop offset="1" stop-color="#0F0F12"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5A4A30"/><stop offset=".5" stop-color="#2A2620"/><stop offset="1" stop-color="#4A3D28"/></linearGradient></defs><style>.t{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}</style><g class="c" style="animation-delay:0.00s"><rect x="12" y="12" width="616" height="118" rx="22" fill="url(#card)" stroke="url(#edge)" stroke-width="1.2"/><text x="52" y="62" class="t" font-size="16" font-weight="600" letter-spacing="5" text-anchor="start" fill="url(#gold)" >CREDITS</text><text x="52" y="100" class="t" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start" fill="#E6DFD3" >Who wrote, produced and played on it</text></g><g class="c" style="animation-delay:0.10s"><rect x="652" y="12" width="616" height="118" rx="22" fill="url(#card)" stroke="url(#edge)" stroke-width="1.2"/><text x="692" y="62" class="t" font-size="16" font-weight="600" letter-spacing="5" text-anchor="start" fill="url(#gold)" >SHARE AS PICTURE</text><text x="692" y="100" class="t" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start" fill="#E6DFD3" >Your song, drawn in your player style</text></g><g class="c" style="animation-delay:0.20s"><rect x="12" y="150" width="616" height="118" rx="22" fill="url(#card)" stroke="url(#edge)" stroke-width="1.2"/><text x="52" y="200" class="t" font-size="16" font-weight="600" letter-spacing="5" text-anchor="start" fill="url(#gold)" >SEARCH</text><text x="52" y="238" class="t" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start" fill="#E6DFD3" >Typos welcome, originals before covers</text></g><g class="c" style="animation-delay:0.30s"><rect x="652" y="150" width="616" height="118" rx="22" fill="url(#card)" stroke="url(#edge)" stroke-width="1.2"/><text x="692" y="200" class="t" font-size="16" font-weight="600" letter-spacing="5" text-anchor="start" fill="url(#gold)" >LOCAL MUSIC</text><text x="692" y="238" class="t" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start" fill="#E6DFD3" >From one folder or the whole phone</text></g><g class="c" style="animation-delay:0.40s"><rect x="12" y="288" width="616" height="118" rx="22" fill="url(#card)" stroke="url(#edge)" stroke-width="1.2"/><text x="52" y="338" class="t" font-size="16" font-weight="600" letter-spacing="5" text-anchor="start" fill="url(#gold)" >OFFLINE</text><text x="52" y="376" class="t" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start" fill="#E6DFD3" >Save whole playlists in lossless</text></g><g class="c" style="animation-delay:0.50s"><rect x="652" y="288" width="616" height="118" rx="22" fill="url(#card)" stroke="url(#edge)" stroke-width="1.2"/><text x="692" y="338" class="t" font-size="16" font-weight="600" letter-spacing="5" text-anchor="start" fill="url(#gold)" >FOR THE SEASON</text><text x="692" y="376" class="t" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start" fill="#E6DFD3" >Quiet holiday touches you can turn off</text></g></svg>
